<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Missing Slice - Rankings</title>
    <link rel="stylesheet" href="../css/styling.css">
    <script src="../javascript/index.js" defer></script>
    <script src="../javascript/ranking.js" defer></script>
</head>
<body>

    <!-- Logo and user account -->
    <div class="account-info">
        <img src="../logo.png" alt="Missing Slice Logo">
        <p id="accountMessage">Playing as Guest</p>
    </div>

    <h1>🏆 Rankings</h1>
    <h2>Top Detectives</h2>

    <p class="explanation">
        See which detectives scored the most points solving the pizza mystery!
    </p>

    <section class="login-section">
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="rankingList"></tbody>
        </table>

        <p id="rankingMessage"></p>

        <a href="index.html">
            <button type="button">Back to Menu</button>
        </a>

        <a href="game.html">
            <button type="button">Play Again</button>
        </a>
    </section>

</body>
</html>
