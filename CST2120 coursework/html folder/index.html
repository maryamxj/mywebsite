<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../css/styling.css">
        <script src="../javascript/index.js" defer></script>
        <meta charset="UTF-8">
        <title>Missing Slice</title>
    </head>
    <body>
    <!-- Logo and user account -->
    <div class="account-info">
        <img src="../logo.png" alt="Missing Slice Logo">
        <p id="accountMessage">Playing as Guest</p>
    </div>

        <h1>Missing slice</h1>
        <h2>🍕 A Pizza Mystery Game 🍕</h2>
        <p class="explanation">One slice is missing and someone is lying.
        Its your job to figure out who stole the last slice.
        </p>

        <div class="menu-buttons">
            <a href="game.html">
                <button>START GAME</button>
            </a>
            <a href="intructions.html">
                <button>HOW TO PLAY</button>
            </a>
            <a href="credits.html">
            <button>CREDITS</button>
        </a>
        </div>

        <h4 class="warning">Choose carefully... you only have 3 lives.</h4>

        <!-- Choose how to play -->
        <section class="player-choice">
            <p class="explanation">Log in to your detective account, or you can go staright to guest!!</p>
            <a href="login.html">
                <button>LOG IN</button>
            </a>
            <a href="game.html?guest=true">
                <button type="button">Play as Guest</button>
            </a>
        </section>
        </section>

    </body>

</html>
