<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Login Missing slice</title>
        <link rel="stylesheet" href="../css/styling.css">
        <script src="../javascript/login.js" defer></script>
        <script src="../javascript/index.js" defer></script>
    </head>
    <body>
        <div class="account-info">
            <img src="../logo.png" alt="Missing Slice Logo">
            <p id="accountMessage">Playing as Guest</p>
        </div>
        <section class="login-section">
            <h1>Missing Slice</h1>
            <h2>Detective Login</h2>
            <p="explanation">Are you ready to start playing</p>

            <form id="loginform">
                <!--Email input-->
                <label for="MyEmail">Email:</label>
                <input type="text" id="MyEmail" placeholder="Enter your registered email">

                <!--Password input-->
                <label for="MyPassword">Password:</label>
                <input type="password" id="MyPassword" placeholder="Enter your password">

                <!--Feeddback message-->
                <p id="message"></p>
                <button>Login</button>
            </form>
            
            <p>Don't have an account?</p> 
            <a href="register.html">
                <button>Register here</button>
            </a>

            <p>Back to main menu</p>
            <a href="index.html">
                <button>Back to the menu</button>
            </a>
            
        </section>
    </body>
</html>
